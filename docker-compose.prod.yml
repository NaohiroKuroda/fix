# =============================================================
# 社内サーバー用 docker-compose（新Fix）
#
# サーバーへは bundle から clone して置く（検証機は /home/felix-projects/fix2）。
# DB は共通の MySQL コンテナ（felix-local-dev の felix-db）がホストの 3307 に
# 公開されているので、host.docker.internal:3307 で繋ぐ（docker network に入る必要はない）。
#
# 起動: docker compose -f docker-compose.prod.yml up -d
#   ※ サーバーは外部ネットワークに出られず composer/npm が動かないため --build は付けない。
#     コードは手元でビルドしたイメージを docker save / load で持ち込む（→ docs/deploy）。
# アクセス: http://<サーバーIP>:8090/
# =============================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-felix-total:latest
    container_name: fix2_app
    restart: unless-stopped
    ports:
      - "8090:80"

    # サイト固有値（APP_URL / APP_KEY / DB_DATABASE / DB_USERNAME / DB_PASSWORD）を読む。
    # docker.env.example をコピーして docker.env を作成し記入する。
    env_file:
      - docker.env

    # 構造的な固定値（env_file より優先される）
    environment:
      APP_NAME: "FELIX 実行予算"
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr

      # 共通 MySQL（felix-db。ホスト 3307 に公開）へ接続。
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: "3307"
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci

      # 既存DBにテーブルを作らないため file/sync
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

    # Linux でも host.docker.internal を有効化（Docker Desktop は標準で解決）
    extra_hosts:
      - "host.docker.internal:host-gateway"
